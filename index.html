<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Paw Grader｜離線教師評分</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#172033">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:5;background:#172033;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}.top b{font-size:18px}.save{margin-left:auto;font-size:12px;opacity:.9}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd}.tabs button{border:0;background:#eef1f7;padding:9px 12px;border-radius:9px;cursor:pointer}.tabs button.active{background:#172033;color:white}.page{display:none;max-width:1200px;margin:auto;padding:18px}.page.active{display:block}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}h2,h3{margin:0 0 12px}button,.btn,input,select,textarea{font:inherit}button,.btn{cursor:pointer;border:1px solid #cfd5df;background:white;padding:8px 12px;border-radius:9px}.primary{background:#2457d6;color:#fff;border-color:#2457d6}.danger{background:#b42318;color:#fff;border-color:#b42318}.warn{background:#f79009;color:#fff;border-color:#f79009}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}input,select,textarea{border:1px solid #cfd5df;border-radius:8px;padding:8px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e8ebf0;text-align:left}th{background:#f8f9fb}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#eef1f7}.done{background:#dcfae6;color:#067647}.partial{background:#fef0c7;color:#93370d}.absent{background:#fee4e2;color:#b42318}.student{padding:12px;border:1px solid #dfe3ea;border-radius:12px;margin:7px 0;display:flex;gap:10px;align-items:center}.student button:first-of-type{margin-left:auto}.score-item{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.score-buttons{display:flex;gap:5px;flex-wrap:wrap}.score-buttons button{min-width:38px}.score-buttons button.sel{background:#2457d6;color:#fff}.qbtn{min-height:90px;font-size:18px}.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;background:#fff4e5;border:1px solid #f7b955}.okbanner{background:#ecfdf3;border-color:#6ce9a6}.big{font-size:28px;font-weight:700}.right{margin-left:auto}.hide{display:none!important}.eventbtn.active{background:#7a5af8;color:white}.log{font-size:13px;max-height:300px;overflow:auto}.log div{padding:6px;border-bottom:1px solid #eee}.stickyActions{position:sticky;bottom:0;background:#ffffffee;padding:10px;border-top:1px solid #ddd;display:flex;gap:8px;backdrop-filter:blur(5px)}.version{font-size:12px;opacity:.85}.updatebar{display:none;background:#fff4e5;border-bottom:1px solid #f7b955;padding:9px 14px;text-align:center}.score-stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.score-input{width:86px;font-size:20px;text-align:center;font-weight:700}.presetbox{padding:12px;border:1px solid #e1e5ec;border-radius:12px;background:#f8f9fb;margin-bottom:12px}
</style>
</head><body>
<div class="top"><b>🐾 Exam Paw Grader</b><span class="pill">離線 PWA</span><span id="versionBadge" class="version"></span><span id="saveState" class="save">尚未建立資料</span></div><div id="updateBar" class="updatebar">發現新版程式。<button onclick="applyUpdate()">立即更新並重新載入</button></div>
<div class="tabs" id="tabs"></div>

<section class="page" id="p-roster"><div class="card"><h2>① 學生名單與 Run</h2><p class="muted">學生名單至少包含「學號、姓名」。可貼上 TSV/CSV，或匯入先前固定版本 JSON。</p>
<div class="grid"><div><h3>貼上名單</h3><textarea id="rosterText" rows="12" style="width:100%" placeholder="學號\t姓名\nS001\t王小明"></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="importRosterText()">匯入名單</button><label>每 Run 人數 <input id="runSize" type="number" min="1" max="10" value="3" style="width:70px"></label><button onclick="shuffleAndGroup()">隨機排序並分 Run</button></div></div>
<div><h3>固定版本</h3><div class="row"><button onclick="lockRoster()">固定目前 Run</button><button onclick="exportRosterJson()">匯出固定名單 JSON</button><button onclick="exportRosterExcel()">匯出固定名單 Excel</button><label class="btn">匯入固定名單 JSON<input type="file" accept="application/json" hidden onchange="importRosterJson(this.files[0])"></label></div><p class="muted">JSON 用來完整恢復；Excel 用於提供學生、助教或其他老師查看。</p><div id="rosterSummary"></div></div></div></div><div class="card"><h3>Run 名單</h3><div id="rosterTable"></div></div></section>

<section class="page" id="p-settings"><div class="card"><h2>② 評分設定</h2><div class="presetbox"><h3>課程評分範本</h3><div class="row"><select id="presetSelect"></select><button onclick="loadPreset()">套用</button><input id="presetName" placeholder="例如：大三跑考－轉位"><button onclick="savePreset()">儲存目前設定</button><button onclick="deletePreset()">刪除所選範本</button></div><div class="row" style="margin-top:8px"><button onclick="exportScoringConfig()">匯出評分設定 JSON</button><label class="btn">匯入評分設定 JSON<input type="file" accept="application/json" hidden onchange="importScoringConfig(this.files[0])"></label></div></div>
<div id="settingsEditor"></div><div class="row"><button onclick="addQuestion()">＋新增大題</button><button onclick="addEventType()">＋新增特殊事件</button></div></div></section>

<section class="page" id="p-exam"><div class="card"><h2>③ 現場評分</h2><div class="row"><label>目前 Run <select id="runSelect" onchange="renderExamRun()"></select></label><button onclick="prevRun()">← 上一 Run</button><button onclick="nextRun()">下一 Run →</button></div></div><div id="examArea"></div></section>
<section class="page" id="p-gradebook"><div class="card"><h2>④ 全部成績</h2><div class="row"><input id="searchBox" placeholder="搜尋學號、姓名" oninput="renderGradebook()"><select id="gradeRun" onchange="renderGradebook()"></select></div></div><div class="card" id="gradebook"></div></section>
<section class="page" id="p-backup"><div class="card"><h2>⑤ 救援 / 輸出</h2><div class="row"><button onclick="exportBackup()">下載完整救援 JSON</button><label class="btn">載入救援 JSON<input type="file" accept="application/json" hidden onchange="importBackup(this.files[0])"></label><button class="primary" onclick="exportFinalExcel()">匯出最終成績 Excel</button><button class="danger" onclick="clearCurrentExam()">清除所有資料／新一輪考試</button></div><p class="muted">清除本次考試不會刪除已儲存的課程評分範本。</p></div><div class="card"><h3>修改歷程</h3><div id="auditLog" class="log"></div></div></section>

<script>
const APP_VERSION='0.2.0';
const DB_NAME='exam-paw-grader'; const DB_VER=1; let db; let state=null; let currentStudent=null; let historicalEdit=false; let newSW=null;
const defaultState=()=>({version:APP_VERSION,rosterLocked:false,runSize:3,students:[],questions:[{id:uid(),name:'大題一',icon:'📝',items:[{id:uid(),name:'評分細項 1',max:5}]}],eventTypes:[{id:uid(),label:'做錯',icon:'⚠️'}],scores:{},events:[],audit:[],runChanges:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function dbGet(k){return new Promise(res=>{let t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)})}
function dbSet(k,v){return new Promise((res,rej)=>{let t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}
function dbDel(k){return new Promise(res=>{let t=db.transaction('kv','readwrite').objectStore('kv').delete(k);t.onsuccess=()=>res()})}
async function save(){state.updatedAt=new Date().toISOString();state.version=APP_VERSION;await dbSet('state',state);document.getElementById('saveState').textContent='已自動儲存 '+new Date().toLocaleTimeString()}
async function getPresets(){return (await dbGet('presets'))||{}}
async function setPresets(p){await dbSet('presets',p);renderPresetSelect()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const tabs=[['roster','名單 / Run'],['settings','評分設定'],['exam','現場評分'],['gradebook','全部成績'],['backup','救援 / 輸出']];
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='roster')renderRoster();if(id==='settings'){renderSettings();renderPresetSelect()}if(id==='exam')renderExam();if(id==='gradebook')renderGradebook();if(id==='backup')renderAudit()}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(x=>`<button data-id="${x[0]}" onclick="showPage('${x[0]}')">${x[1]}</button>`).join('')}
function parseRoster(txt){let lines=txt.trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return[];let delim=lines[0].includes('\t')?'\t':',';let rows=lines.map(l=>l.split(delim).map(x=>x.trim()));let h=rows[0].map(x=>x.toLowerCase());let idIdx=h.findIndex(x=>/學號|student.?id|id/.test(x));let nameIdx=h.findIndex(x=>/姓名|name/.test(x));let start=0;if(idIdx>=0&&nameIdx>=0)start=1;else{idIdx=0;nameIdx=1}return rows.slice(start).filter(r=>r[idIdx]&&r[nameIdx]).map((r,i)=>({student_id:r[idIdx],name:r[nameIdx],run:null,order:null,status:'pending',drawn_question:'',origIndex:i}))}
async function importRosterText(){let a=parseRoster(document.getElementById('rosterText').value);if(!a.length)return alert('找不到學生資料');state.students=a;state.rosterLocked=false;await save();renderRoster();renderRunSelectors();}
async function shuffleAndGroup(){if(state.rosterLocked&&!confirm('固定版本已存在。仍要重新隨機排序嗎？'))return;let n=Math.max(1,+document.getElementById('runSize').value||3);state.runSize=n;let a=[...state.students];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.forEach((s,i)=>{s.run=Math.floor(i/n)+1;s.order=i%n+1});state.students=a;state.rosterLocked=false;await save();renderRoster();renderRunSelectors()}
async function lockRoster(){if(!state.students.length)return alert('請先匯入名單');if(state.students.some(s=>!s.run))return alert('請先分 Run');state.rosterLocked=true;await save();renderRoster();alert('目前 Run 名單已固定')}
function renderRoster(){let s=state.students;document.getElementById('runSize').value=state.runSize||3;document.getElementById('rosterSummary').innerHTML=`<p>${state.rosterLocked?'🔒 已固定':'尚未固定'}｜${s.length} 人｜${Math.max(0,...s.map(x=>x.run||0))} Run</p>`;document.getElementById('rosterTable').innerHTML=s.length?`<table><thead><tr><th>Run</th><th>順序</th><th>學號</th><th>姓名</th><th>狀態</th><th>調整</th></tr></thead><tbody>${[...s].sort(sortStudent).map(x=>`<tr><td>${x.run??''}</td><td>${x.order??''}</td><td>${esc(x.student_id)}</td><td>${esc(x.name)}</td><td>${statusLabel(x)}</td><td><button onclick="toggleAbsent('${x.student_id}')">${x.status==='absent'?'取消缺考':'缺考'}</button> <button onclick="moveStudentPrompt('${x.student_id}')">移 Run</button></td></tr>`).join('')}</tbody></table>`:'尚無名單'}
function sortStudent(a,b){return (a.run||9999)-(b.run||9999)||(a.order||9999)-(b.order||9999)}
function statusLabel(s){if(s.status==='absent')return '<span class="pill absent">缺考</span>';let st=studentProgress(s.student_id);return st==='done'?'<span class="pill done">完成</span>':st==='partial'?'<span class="pill partial">部分</span>':'<span class="pill">未評</span>'}
function studentProgress(id){let q=state.questions,sc=state.scores[id]||{};let total=q.reduce((n,Q)=>n+Q.items.length,0),filled=q.reduce((n,Q)=>n+Q.items.filter(i=>sc[Q.id]?.[i.id]!==undefined).length,0);return !filled?'none':filled>=total&&total?'done':'partial'}
async function toggleAbsent(id){let s=state.students.find(x=>x.student_id===id);let old=s.status;s.status=s.status==='absent'?'pending':'absent';audit('status',id,'status',old,s.status);await save();renderRoster();renderExamRun();renderGradebook()}
async function moveStudentPrompt(id){let s=state.students.find(x=>x.student_id===id);let r=prompt(`將 ${s.student_id} ${s.name} 移到哪一個 Run？`,s.run);if(r===null)return;r=+r;if(!r||r<1)return;let old=s.run;s.run=r;let inrun=state.students.filter(x=>x.run===r&&x.student_id!==id);s.order=Math.max(0,...inrun.map(x=>x.order||0))+1;state.runChanges.push({time:new Date().toISOString(),student_id:id,before:old,after:r});audit('run',id,'run',old,r);await save();renderRoster();renderRunSelectors();}
function exportRosterJson(){download('fixed-run-list.json',JSON.stringify({type:'exam-paw-fixed-roster',version:APP_VERSION,runSize:state.runSize,students:state.students},null,2),'application/json')}
async function importRosterJson(f){if(!f)return;let o=JSON.parse(await f.text());if(!o.students)return alert('格式不正確');state.students=o.students;state.runSize=o.runSize||3;state.rosterLocked=true;await save();renderRoster();renderRunSelectors()}
function xml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function workbookXml(sheets){let html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>table{border-collapse:collapse}td,th{border:1px solid #888;padding:4px}th{font-weight:bold;background:#eee}</style></head><body>`;for(let sh of sheets){html+=`<h2>${xml(sh.name)}</h2><table><tr>${sh.rows[0].map(x=>`<th>${xml(x)}</th>`).join('')}</tr>${sh.rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${xml(x)}</td>`).join('')}</tr>`).join('')}</table><br>`}return html+'</body></html>'}
function exportRosterExcel(){let rows=[['Run','組內順序','學號','姓名'],...[...state.students].sort(sortStudent).map(s=>[s.run,s.order,s.student_id,s.name])];download('固定Run名單.xls',workbookXml([{name:'Run名單',rows}]),'application/vnd.ms-excel')}
function renderSettings(){document.getElementById('settingsEditor').innerHTML=state.questions.map((q,qi)=>`<div class="card"><div class="row"><input value="${esc(q.icon)}" style="width:60px" onchange="updQ('${q.id}','icon',this.value)"><input value="${esc(q.name)}" onchange="updQ('${q.id}','name',this.value)"><button class="danger" onclick="delQ('${q.id}')">刪除大題</button></div>${q.items.map(i=>`<div class="row" style="margin:8px 0"><input value="${esc(i.name)}" onchange="updItem('${q.id}','${i.id}','name',this.value)"><label>滿分 <input type="number" min="0" step="1" value="${i.max}" style="width:80px" onchange="updItem('${q.id}','${i.id}','max',+this.value)"></label><button onclick="delItem('${q.id}','${i.id}')">刪除</button></div>`).join('')}<button onclick="addItem('${q.id}')">＋細項</button></div>`).join('')+`<div class="card"><h3>特殊事件</h3>${state.eventTypes.map(e=>`<div class="row" style="margin:6px 0"><input value="${esc(e.icon)}" style="width:60px" onchange="updEvent('${e.id}','icon',this.value)"><input value="${esc(e.label)}" onchange="updEvent('${e.id}','label',this.value)"><button onclick="delEvent('${e.id}')">刪除</button></div>`).join('')}</div>`}
async function updQ(id,k,v){state.questions.find(x=>x.id===id)[k]=v;await save()} async function updItem(q,i,k,v){state.questions.find(x=>x.id===q).items.find(x=>x.id===i)[k]=v;await save()} async function updEvent(id,k,v){state.eventTypes.find(x=>x.id===id)[k]=v;await save()}
async function addQuestion(){state.questions.push({id:uid(),name:'新大題',icon:'📝',items:[{id:uid(),name:'評分細項',max:5}]});await save();renderSettings()} async function delQ(id){state.questions=state.questions.filter(x=>x.id!==id);await save();renderSettings()} async function addItem(q){state.questions.find(x=>x.id===q).items.push({id:uid(),name:'新細項',max:5});await save();renderSettings()} async function delItem(q,i){state.questions.find(x=>x.id===q).items=state.questions.find(x=>x.id===q).items.filter(x=>x.id!==i);await save();renderSettings()} async function addEventType(){state.eventTypes.push({id:uid(),label:'新事件',icon:'⚠️'});await save();renderSettings()} async function delEvent(id){state.eventTypes=state.eventTypes.filter(x=>x.id!==id);await save();renderSettings()}
function scoringConfig(){return {type:'exam-paw-scoring-config',version:APP_VERSION,questions:structuredClone(state.questions),eventTypes:structuredClone(state.eventTypes)}}
function exportScoringConfig(){download('scoring-config.json',JSON.stringify(scoringConfig(),null,2),'application/json')}
async function importScoringConfig(f){if(!f)return;let o=JSON.parse(await f.text());if(!o.questions)return alert('設定檔格式不正確');state.questions=o.questions;state.eventTypes=o.eventTypes||[];await save();renderSettings()}
async function renderPresetSelect(){let p=await getPresets(),sel=document.getElementById('presetSelect');if(!sel)return;let ks=Object.keys(p);sel.innerHTML='<option value="">選擇已儲存範本</option>'+ks.map(k=>`<option>${esc(k)}</option>`).join('')}
async function savePreset(){let name=document.getElementById('presetName').value.trim();if(!name)return alert('請輸入範本名稱');let p=await getPresets();p[name]=scoringConfig();await setPresets(p);document.getElementById('presetSelect').value=name;alert('已儲存評分範本')}
async function loadPreset(){let name=document.getElementById('presetSelect').value;if(!name)return;let p=await getPresets(),o=p[name];state.questions=structuredClone(o.questions);state.eventTypes=structuredClone(o.eventTypes||[]);await save();renderSettings()}
async function deletePreset(){let name=document.getElementById('presetSelect').value;if(!name)return;if(!confirm(`刪除評分範本「${name}」？`))return;let p=await getPresets();delete p[name];await setPresets(p)}
function renderRunSelectors(){let runs=[...new Set(state.students.map(x=>x.run).filter(Boolean))].sort((a,b)=>a-b);['runSelect','gradeRun'].forEach((id,idx)=>{let e=document.getElementById(id);if(!e)return;let cur=e.value;e.innerHTML=(idx?'<option value="">全部 Run</option>':'')+runs.map(r=>`<option value="${r}">Run ${r}</option>`).join('');if([...e.options].some(o=>o.value===cur))e.value=cur});}
function renderExam(){renderRunSelectors();renderExamRun()}
function renderExamRun(){let sel=document.getElementById('runSelect');if(!sel)return;let run=+sel.value;if(!run){document.getElementById('examArea').innerHTML='<div class="card">尚無 Run</div>';return}let ss=state.students.filter(s=>s.run===run).sort((a,b)=>a.order-b.order);document.getElementById('examArea').innerHTML=`<div class="card"><h3>Run ${run}</h3>${ss.map(s=>`<div class="student"><b>${esc(s.name)}</b><span>${esc(s.student_id)}</span>${statusLabel(s)}<button onclick="openStudent('${s.student_id}',false)">${s.status==='absent'?'查看':'開始 / 修改'}</button></div>`).join('')}</div>`}
function prevRun(){let s=document.getElementById('runSelect'),i=s.selectedIndex;if(i>0){s.selectedIndex=i-1;renderExamRun()}} function nextRun(){let s=document.getElementById('runSelect'),i=s.selectedIndex;if(i<s.options.length-1){s.selectedIndex=i+1;renderExamRun()}}
function openStudent(id,hist){currentStudent=id;historicalEdit=!!hist;showPage('exam');renderStudentScore()}
function renderStudentScore(){let s=state.students.find(x=>x.student_id===currentStudent);if(!s)return;let sc=state.scores[currentStudent]||{};document.getElementById('examArea').innerHTML=`${historicalEdit?'<div class="banner">🟠 歷史成績編輯模式</div>':''}<div class="card"><div class="row"><div><h2>${esc(s.name)}</h2><div>${esc(s.student_id)}｜Run ${s.run}｜組內順序 ${s.order}</div></div><button class="right" onclick="renderExamRun()">回 Run 名單</button></div></div>${state.questions.map(q=>`<div class="card"><h3>${esc(q.icon)} ${esc(q.name)} <span class="pill">${questionTotal(currentStudent,q.id)} / ${q.items.reduce((a,b)=>a+(+b.max||0),0)}</span></h3>${q.items.map(i=>scoreControl(currentStudent,q,i)).join('')}</div>`).join('')}<div class="card"><h3>特殊事件</h3><div class="row">${state.eventTypes.map(e=>`<button class="eventbtn" onclick="toggleEvent('${currentStudent}','${e.id}')">${esc(e.icon)} ${esc(e.label)}</button>`).join('')}</div></div><div class="stickyActions"><button onclick="renderExamRun()">← 回本 Run</button><button class="primary" onclick="chooseNextInRun('${currentStudent}')">下一位學生</button></div>`}
function scoreControl(st,q,i){let v=state.scores[st]?.[q.id]?.[i.id];let m=+i.max||0;if(m<=5){return `<div class="score-item"><div><b>${esc(i.name)}</b><div class="muted">滿分 ${m}</div></div><div class="score-buttons">${Array.from({length:m+1},(_,n)=>`<button class="${v===n?'sel':''}" onclick="setScore('${st}','${q.id}','${i.id}',${n})">${n}</button>`).join('')}<input class="score-input" type="number" inputmode="decimal" min="0" max="${m}" step="1" value="${v??''}" onchange="setScoreFromInput('${st}','${q.id}','${i.id}',this,${m})"></div></div>`}return `<div class="score-item"><div><b>${esc(i.name)}</b><div class="muted">滿分 ${m}</div></div><div class="score-stepper"><button onclick="stepScore('${st}','${q.id}','${i.id}',-5,${m})">◀ −5</button><input class="score-input" type="number" inputmode="decimal" min="0" max="${m}" step="1" value="${v??''}" placeholder="—" onchange="setScoreFromInput('${st}','${q.id}','${i.id}',this,${m})"><button onclick="stepScore('${st}','${q.id}','${i.id}',5,${m})">+5 ▶</button><button onclick="setScore('${st}','${q.id}','${i.id}',0)">0</button><button onclick="setScore('${st}','${q.id}','${i.id}',${m})">滿分</button></div></div>`}
async function stepScore(st,q,i,d,m){let old=state.scores[st]?.[q]?.[i];let base=old===undefined?0:+old;let v=Math.max(0,Math.min(m,base+d));await setScore(st,q,i,v)}
async function setScoreFromInput(st,q,i,el,m){if(el.value==='')return;let v=Math.max(0,Math.min(m,+el.value));el.value=v;await setScore(st,q,i,v)}
async function setScore(st,q,i,v){state.scores[st]??={};state.scores[st][q]??={};let old=state.scores[st][q][i];state.scores[st][q][i]=v;audit('score',st,`${q}.${i}`,old,v);await save();renderStudentScore()}
function questionTotal(st,qid){let q=state.questions.find(x=>x.id===qid),sc=state.scores[st]?.[qid]||{};return q.items.reduce((n,i)=>n+(sc[i.id]===undefined?0:+sc[i.id]),0)}
async function toggleEvent(st,eid){let e=state.eventTypes.find(x=>x.id===eid);let active=state.events.find(x=>x.student_id===st&&x.event_id===eid&&!x.deleted);if(active){active.deleted=true;active.deletedAt=new Date().toISOString();audit('event',st,e.label,'active','deleted')}else{state.events.push({id:uid(),student_id:st,event_id:eid,label:e.label,icon:e.icon,time:new Date().toISOString(),deleted:false});audit('event',st,e.label,null,'active')}await save();renderStudentScore()}
function chooseNextInRun(id){let s=state.students.find(x=>x.student_id===id),ss=state.students.filter(x=>x.run===s.run).sort((a,b)=>a.order-b.order);document.getElementById('examArea').innerHTML=`<div class="card"><h2>Run ${s.run}：請選擇現在到站的學生</h2>${ss.map(x=>`<div class="student"><b>${esc(x.name)}</b><span>${esc(x.student_id)}</span>${statusLabel(x)}<button onclick="openStudent('${x.student_id}',false)">選擇</button></div>`).join('')}<button onclick="renderExamRun()">回 Run 名單</button></div>`}
function renderGradebook(){renderRunSelectors();let run=document.getElementById('gradeRun')?.value,q=(document.getElementById('searchBox')?.value||'').toLowerCase();let ss=state.students.filter(s=>(!run||String(s.run)===run)&&(!q||s.student_id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q))).sort(sortStudent);document.getElementById('gradebook').innerHTML=`<table><thead><tr><th>Run</th><th>學號</th><th>姓名</th>${state.questions.map(Q=>`<th>${esc(Q.name)}</th>`).join('')}<th>平均</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${s.run}</td><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td>${state.questions.map(Q=>`<td>${questionHasAny(s.student_id,Q.id)?questionTotal(s.student_id,Q.id):''}</td>`).join('')}<td>${studentAverage(s.student_id)}</td><td><button onclick="openStudent('${s.student_id}',true)">查看 / 修改</button></td></tr>`).join('')}</tbody></table>`}
function questionHasAny(st,q){return Object.keys(state.scores[st]?.[q]||{}).length>0} function studentAverage(st){let vals=state.questions.filter(q=>questionHasAny(st,q.id)).map(q=>questionTotal(st,q.id));return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):''}
function audit(type,student_id,field,before,after){if(before===after)return;state.audit.push({time:new Date().toISOString(),type,student_id,field,before,after})}
function renderAudit(){document.getElementById('auditLog').innerHTML=[...state.audit].reverse().map(a=>`<div>${new Date(a.time).toLocaleString()}｜${esc(a.student_id||'')}｜${esc(a.type)}｜${esc(a.field)}｜${esc(a.before)} → ${esc(a.after)}</div>`).join('')||'尚無修改紀錄'}
function exportBackup(){download(`exam-paw-grader-backup-${Date.now()}.json`,JSON.stringify({type:'exam-paw-grader-backup',version:APP_VERSION,state},null,2),'application/json')}
async function importBackup(f){if(!f)return;let o=JSON.parse(await f.text());if(!o.state)return alert('備份格式不正確');if(!confirm('載入備份會取代目前考試資料，確定？'))return;state=o.state;await save();renderAll();alert('已恢復備份')}
async function clearCurrentExam(){if(!confirm('確定清除本次考試所有學生、Run、成績、事件與修改紀錄？\n已儲存的評分範本會保留。'))return;if(!confirm('這個動作無法復原，建議先下載救援 JSON。仍要開始新一輪考試？'))return;state=defaultState();await save();renderAll();showPage('roster')}
function exportFinalExcel(){let headers=['Run','組內順序','學號','姓名'];state.questions.forEach(q=>{q.items.forEach(i=>headers.push(`${q.name}-${i.name}`));headers.push(`${q.name}-總分`)});headers.push('最後平均');let rows=[headers];[...state.students].sort(sortStudent).forEach(s=>{let r=[s.run,s.order,s.student_id,s.name];state.questions.forEach(q=>{q.items.forEach(i=>r.push(state.scores[s.student_id]?.[q.id]?.[i.id]??''));r.push(questionHasAny(s.student_id,q.id)?questionTotal(s.student_id,q.id):'')});r.push(studentAverage(s.student_id));rows.push(r)});let eventRows=[['時間','Run','學號','姓名','事件','狀態']];state.events.forEach(e=>{let s=state.students.find(x=>x.student_id===e.student_id)||{};eventRows.push([e.time,s.run,e.student_id,s.name,e.label,e.deleted?'已刪除':'有效'])});let auditRows=[['時間','學號','類型','欄位','Before','After'],...state.audit.map(a=>[a.time,a.student_id,a.type,a.field,a.before,a.after])];download('最終成績.xls',workbookXml([{name:'最終成績',rows},{name:'事件紀錄',rows:eventRows},{name:'修改歷程',rows:auditRows}]),'application/vnd.ms-excel')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderAll(){renderRoster();renderSettings();renderRunSelectors();renderExamRun();renderGradebook();renderAudit();renderPresetSelect()}
async function init(){document.getElementById('versionBadge').textContent='v'+APP_VERSION;renderTabs();await openDB();state=(await dbGet('state'))||defaultState();await save();renderAll();showPage('roster');setupSW()}
function setupSW(){if(!('serviceWorker'in navigator)||location.protocol==='file:')return;navigator.serviceWorker.register('./service-worker.js').then(reg=>{if(reg.waiting)showUpdate(reg.waiting);reg.addEventListener('updatefound',()=>{let w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate(w)})})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload())}
function showUpdate(w){newSW=w;document.getElementById('updateBar').style.display='block'} function applyUpdate(){newSW?.postMessage({type:'SKIP_WAITING'})}
init();
</script></body></html>
