name: Deploy Pages with Preview

on:
  push:
    branches:
      - main
      - dev-import-spreadsheet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev-import-spreadsheet
          path: dev

      - name: Assemble site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -a stable/. site/
          rm -rf site/.git site/.github

          # Vendor SheetJS into the deployed site so XLSX/XLS/Numbers import
          # continues to work after the PWA has been installed and is offline.
          curl -fL --retry 3 -o site/xlsx.full.min.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js
          curl -fL --retry 3 -o site/xlsx.zahl.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.zahl.js

          # Stable main uses the released spreadsheet-import helper.
          python3 - <<'PY'
          from pathlib import Path
          marker = '<script src="./dev-import.js"></script>\n'
          for name in ('index.html', 'exam-paw-grader.html'):
              p = Path('site') / name
              s = p.read_text(encoding='utf-8')
              if marker.strip() not in s:
                  pos = s.rfind('</body>')
                  if pos < 0: raise SystemExit(f'{name}: final </body> not found')
                  s = s[:pos] + marker + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

          # Preview is assembled from known-good stable HTML plus the current
          # development helper. It gets its own local SheetJS copies.
          mkdir -p site/preview
          cp stable/index.html site/preview/index.html
          cp stable/exam-paw-grader.html site/preview/exam-paw-grader.html
          cp stable/manifest.webmanifest site/preview/manifest.webmanifest
          cp stable/service-worker.js site/preview/service-worker.js
          cp stable/icon-192.png site/preview/icon-192.png
          cp stable/icon-512.png site/preview/icon-512.png
          cp dev/dev-import.js site/preview/dev-import.js
          cp site/xlsx.full.min.js site/preview/xlsx.full.min.js
          cp site/xlsx.zahl.js site/preview/xlsx.zahl.js

          python3 - <<'PY'
          from pathlib import Path
          marker = '<script src="./dev-import.js"></script>\n'
          for name in ('index.html', 'exam-paw-grader.html'):
              p = Path('site/preview') / name
              s = p.read_text(encoding='utf-8')
              if marker.strip() not in s:
                  pos = s.rfind('</body>')
                  if pos < 0: raise SystemExit(f'{name}: final </body> not found')
                  s = s[:pos] + marker + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          for base in (Path('site'), Path('site/preview')):
              for name in ('index.html', 'exam-paw-grader.html'):
                  s=(base/name).read_text(encoding='utf-8')
                  ref='<script src="./dev-import.js"></script>'
                  assert s.count(ref)==1, f'{base}/{name}: helper count'
                  refpos=s.index(ref)
                  assert refpos > s.rfind('</script>',0,refpos), f'{base}/{name}: helper inside main script'
                  assert refpos < s.rfind('</body>'), f'{base}/{name}: helper outside body'
          PY

          test -s site/xlsx.full.min.js
          test -s site/xlsx.zahl.js
          test -f site/preview/index.html
          test -f site/preview/dev-import.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
