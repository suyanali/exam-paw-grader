name: Deploy Pages with Preview

on:
  push:
    branches:
      - main
      - dev-import-spreadsheet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev-import-spreadsheet
          path: dev

      - name: Assemble site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -a stable/. site/
          rm -rf site/.git site/.github

          mkdir -p site/preview
          cp stable/index.html site/preview/index.html
          cp stable/exam-paw-grader.html site/preview/exam-paw-grader.html
          cp stable/manifest.webmanifest site/preview/manifest.webmanifest
          cp stable/service-worker.js site/preview/service-worker.js
          cp stable/icon-192.png site/preview/icon-192.png
          cp stable/icon-512.png site/preview/icon-512.png
          cp dev/dev-import.js site/preview/dev-import.js

          # Insert the preview helper ONLY before the final real </body> tag.
          # The app JavaScript itself contains the literal string </body>
          # inside workbookXml(), so a global string replacement corrupts
          # the main <script> block and makes JavaScript appear as page text.
          python3 - <<'PY'
          from pathlib import Path
          marker = '<script src="./dev-import.js"></script>\n'
          for name in ('index.html', 'exam-paw-grader.html'):
              p = Path('site/preview') / name
              s = p.read_text(encoding='utf-8')
              if marker.strip() not in s:
                  pos = s.rfind('</body>')
                  if pos < 0:
                      raise SystemExit(f'{name}: final </body> not found')
                  s = s[:pos] + marker + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

          # Structural checks: exactly one external dev helper reference and
          # it must occur after the main inline script has closed.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'exam-paw-grader.html'):
              s = (Path('site/preview') / name).read_text(encoding='utf-8')
              ref = '<script src="./dev-import.js"></script>'
              assert s.count(ref) == 1, f'{name}: unexpected dev helper count'
              refpos = s.index(ref)
              last_inline_close = s.rfind('</script>', 0, refpos)
              assert last_inline_close >= 0, f'{name}: main script close missing'
              assert refpos > last_inline_close, f'{name}: helper inserted inside main script'
              assert refpos < s.rfind('</body>'), f'{name}: helper not inside body'
          PY

          test -f site/index.html
          test -f site/preview/index.html
          test -f site/preview/dev-import.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
