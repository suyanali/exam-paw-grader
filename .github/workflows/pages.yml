name: Deploy Pages with Preview

on:
  push:
    branches:
      - main
      - dev-import-spreadsheet
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev-import-spreadsheet
          path: dev

      - name: Assemble site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -a stable/. site/
          rm -rf site/.git site/.github

          # Preview starts from the known-good stable app, then adds only
          # development helper files. This prevents an older/broken HTML
          # snapshot on the dev branch from becoming the preview page.
          mkdir -p site/preview
          cp stable/index.html site/preview/index.html
          cp stable/exam-paw-grader.html site/preview/exam-paw-grader.html
          cp stable/manifest.webmanifest site/preview/manifest.webmanifest
          cp stable/service-worker.js site/preview/service-worker.js
          cp stable/icon-192.png site/preview/icon-192.png
          cp stable/icon-512.png site/preview/icon-512.png
          cp dev/dev-import.js site/preview/dev-import.js

          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'exam-paw-grader.html'):
              p = Path('site/preview') / name
              s = p.read_text(encoding='utf-8')
              if 'dev-import.js' not in s:
                  s = s.replace('</body>', '<script src="./dev-import.js"></script>\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

          echo '--- deployed site files ---'
          find site -maxdepth 2 -type f -print | sort
          test -f site/index.html
          test -f site/preview/index.html
          test -f site/preview/dev-import.js
          grep -q '<!doctype html>' site/preview/index.html
          grep -q 'dev-import.js' site/preview/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
